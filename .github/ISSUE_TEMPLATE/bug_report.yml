name: Bug Report
description: Report a bug or unexpected behavior in the AssetTrack sample
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below so we can investigate.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Affected service
      description: Which service or area of the polyglot stack is affected?
      options:
        - web (Astro SSR + React)
        - assets-svc (.NET 10)
        - workforce-svc (Java 21 / Spring Boot 3)
        - reporting-svc (Python FastAPI)
        - notifications-svc (Python FastAPI)
        - audit-svc (legacy Java 11 / Spring Boot 2.7)
        - auth-svc (legacy Java 11 / Spring Boot 2.7)
        - devcontainer / tooling
        - docs / other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: If applicable, add screenshots or relevant log output to help explain the problem.
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running the app?
      options:
        - Codespaces / devcontainer
        - Local devcontainer (VS Code Dev Containers)
        - Local without a devcontainer (npm run dev)
        - Docker Compose (docker compose up)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide relevant environment details.
      placeholder: |
        - OS: [e.g. macOS 15, Ubuntu 22.04, Windows 11]
        - Browser (for web issues): [e.g. Chrome 130, Safari 18]
        - Node.js: [e.g. 22.x]
        - .NET / Java / Python versions (if relevant): [e.g. .NET 10, Java 21 + Java 11, Python 3.12]
    validations:
      required: true
